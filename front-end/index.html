<!doctype html>
<html lang="pt-BR">
  <head>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoAlerta — Problemas urbanos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>GeoAlerta</h1>
    <p>Registre e visualize problemas urbanos no mapa.</p>
    <div id="map"></div>
    <div id="buscar">
      <input
        type="text"
        id="buscar-inp"
        placeholder="insira o local a ser buscado"
      /><button id="btnBuscar">Buscar</button>
    </div>
    <div id="form">
      <input type="text" id="campoNome" placeholder="Informe o nome" />
      <input
        type="text"
        id="campoDescricao"
        placeholder="Informe a descrição"
      />
      <select id="campoTipo" aria-label="Categoria da ocorrência">
        <option value="Buraco na via">Buraco na via</option>
        <option value="Iluminação pública">Iluminação pública</option>
        <option value="Acúmulo de lixo">Acúmulo de lixo</option>
        <option value="Alagamento">Alagamento</option>
        <option value="Esgoto a céu aberto">Esgoto a céu aberto</option>
        <option value="Outros">Outros</option>
      </select>
      <label for="campoStatus">Status</label>

      <select id="campoStatus">
        <option value="Pendente">Pendente</option>
        <option value="Em andamento">Em andamento</option>
        <option value="Resolvido">Resolvido</option>
      </select>
      <button id="btnSalvar">Salvar</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
